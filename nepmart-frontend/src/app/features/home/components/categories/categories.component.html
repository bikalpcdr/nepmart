<nav class="nm-cats" aria-label="Product categories">
  @for (c of categories; track c.slug) {
    <a class="nm-cat" [routerLink]="['/shop', c.slug]">
      <span class="nm-ic" [style.background]="c.bg" [style.color]="c.color" aria-hidden="true">
        @switch (c.icon) {
          @case ('basket') {
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            >
              <path d="M5 9h14l-1.5 8.5a2 2 0 0 1-2 1.5h-7a2 2 0 0 1-2-1.5Z" />
              <path d="M8.5 9 12 3l3.5 6M10 13v3M14 13v3" />
            </svg>
          }
          @case ('phone') {
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            >
              <rect x="7" y="2.5" width="10" height="19" rx="2.5" />
              <path d="M11 18.5h2" />
            </svg>
          }
          @case ('shirt') {
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            >
              <path d="m9 3-5 4 2.2 2.8L8 8.5V21h8V8.5l1.8 1.3L20 7l-5-4a3 3 0 0 1-6 0Z" />
            </svg>
          }
          @case ('home') {
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            >
              <path d="m3 11 9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H4a1 1 0 0 1-1-1Z" />
            </svg>
          }
          @case ('beauty') {
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            >
              <path d="M9 3h6v4l1.5 2v12H7.5V9L9 7Z" />
              <path d="M7.5 12h9" />
            </svg>
          }
          @case ('ball') {
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            >
              <circle cx="12" cy="12" r="8.5" />
              <path d="M12 7.5 15.5 10l-1.3 4h-4.4l-1.3-4Z" />
              <path d="M12 3.5v4M5 8l3.5 2M19 8l-3.5 2M7 19.5 9.8 14M17 19.5 14.2 14" />
            </svg>
          }
          @case ('toy') {
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            >
              <rect x="5" y="9" width="14" height="10" rx="2" />
              <path d="M9 9V7a3 3 0 1 1 6 0v2M9.5 14h.01M14.5 14h.01M9.5 16.5h5" />
            </svg>
          }
          @default {
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            >
              <path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2Z" />
              <path d="M4 19a2 2 0 0 1 2-2h13M9 7h6" />
            </svg>
          }
        }
      </span>
      <span class="nm-name">{{ c.name }}</span>
      <em>({{ c.count }})</em>
    </a>
  }
</nav>
