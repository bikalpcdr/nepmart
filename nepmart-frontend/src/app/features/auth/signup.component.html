<section class="wrap">
  <div class="card">
    <h1>Create account</h1>
    <p class="sub">Join Nepmart free — fresh goods delivered to your door.</p>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        Full name
        <input
          type="text"
          formControlName="fullName"
          placeholder="Your name"
          autocomplete="name"
          spellcheck="false"
          autocapitalize="words"
        >
      </label>
      <label>
        Email
        <input
          type="email"
          formControlName="email"
          placeholder="you@example.com"
          autocomplete="email"
          spellcheck="false"
          autocapitalize="none"
          autocorrect="off"
        >
      </label>
      <label>
        Phone (optional)
        <input
          type="tel"
          formControlName="phoneNumber"
          placeholder="+977-..."
          autocomplete="tel"
          spellcheck="false"
        >
      </label>
      <label>
        Password (min 8 chars, upper + lower + digit + special)
        <div class="password-wrapper">
          <input
            type="password"
            formControlName="password"
            placeholder="••••••••"
            [type]="hidePassword ? 'password' : 'text'"
            autocomplete="new-password"
            spellcheck="false"
            autocapitalize="none"
            autocorrect="off"
          >
          <button
            type="button"
            class="eye-toggle"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'"
            [attr.aria-pressed]="!hidePassword"
          >
            @if (hidePassword) {
              <svg
                class="eye-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            } @else {
              <svg
                class="eye-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <path d="M19 12H5" />
              </svg>
            }
          </button>
        </div>
      </label>
      @if (error) {
        <p class="error">{{ error }}</p>
      }
      <button class="btn-solid" type="submit">Join Free</button>
    </form>
    <p class="swap">Already have an account? <a routerLink="/login">Sign in</a></p>
  </div>
</section>
